name = "outreach-track"
main = "src/index.js"
compatibility_date = "2025-01-01"

[[d1_databases]]
binding = "DB"
database_name = "outreach-track"
database_id = "REPLACE_AFTER_wrangler_d1_create"

[vars]
RESUME_URL = "https://REPLACE_WITH_YOUR_RESUME_LINK"

# Attach your own domain (a "track." subdomain) in the Cloudflare dashboard: Workers > outreach-track > Settings > Domains.
# Secret (never in this file):  npx wrangler secret put TRACK_TOKEN
