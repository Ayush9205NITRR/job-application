name: Pipeline test run

# Manual. Runs pipeline.py once and uploads the raw Apify output as an artifact so field names can be checked.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no Airtable writes)"
        type: boolean
        default: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
      AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
      AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID || 'app40Dtij4xm0M2aW' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests python-dotenv
      - name: Print actor input schema
        continue-on-error: true
        run: |
          curl -sS "https://api.apify.com/v2/acts/meka.im~linkedin-jobs-scraper/builds/default?token=$APIFY_TOKEN" \
          | python -c "
          import json,sys
          d=json.load(sys.stdin)['data']
          sch=json.loads(d['inputSchema']) if isinstance(d.get('inputSchema'),str) else d.get('inputSchema',{})
          print('required:',sch.get('required'))
          for k,v in sch.get('properties',{}).items():
              print(k,'|',v.get('type'),'|',v.get('enum') or '','|default=',v.get('default'),'|',(v.get('description') or '')[:90])
          "
      - run: python pipeline.py --dump data/raw.json ${{ inputs.dry_run && '--dry-run' || '' }}
      - name: Show field names of first item
        if: always()
        run: python -c "import json;d=json.load(open('data/raw.json'));print(len(d),'items');print(sorted(d[0]) if d else 'EMPTY')"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raw-apify
          path: data/raw.json
