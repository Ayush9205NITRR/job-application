name: Outreach refresh

# Keeps the Grist doc current without the laptop being on.
#
# Runs on a timer ONLY when this file is on the default branch. Times are UTC (IST = UTC + 5:30):
#   37 3,8,14 * * *  =  09:07, 14:07 and 20:07 IST
#
# Three runs a day on purpose. Grist's free plan allows 3000 API calls a month across the whole site,
# and a run costs under ten, so this uses roughly a quarter of the budget and leaves room for your own
# work in the doc. Every run writes a row to Refresh_Runs with the exact call count.
#
# Needs these repository secrets:
#   GRIST_URL GRIST_API_KEY GRIST_DOC_ID                            (Grist)
#   GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET GOOGLE_REFRESH_TOKEN      (read-only Gmail; see outreach/README.md)
# Without the Google ones the run still works: it imports files and skips the Gmail step.

on:
  schedule:
    - cron: "37 3,8,14 * * *"
  workflow_dispatch:
    inputs:
      skip_gmail:
        description: "Skip the Gmail step"
        type: boolean
        default: false
      dry:
        description: "Dry run: read only, writes nothing"
        type: boolean
        default: false

concurrency: outreach-refresh

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: outreach
    env:
      GRIST_URL: ${{ secrets.GRIST_URL }}
      GRIST_API_KEY: ${{ secrets.GRIST_API_KEY }}
      GRIST_DOC_ID: ${{ secrets.GRIST_DOC_ID }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: outreach/requirements.txt

      - run: pip install -r requirements.txt

      - name: Check the credentials are present
        run: |
          missing=
          for name in GRIST_URL GRIST_API_KEY GRIST_DOC_ID; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "Missing repository secret(s):$missing" >&2
            echo "Add them under Settings > Secrets and variables > Actions." >&2
            exit 1
          fi
          if [ -z "$GOOGLE_REFRESH_TOKEN" ]; then
            echo "::warning::No GOOGLE_REFRESH_TOKEN, so the Gmail step will be skipped."
          fi

      - name: Tests
        run: |
          python3 tests/test_all.py
          python3 tests/test_ui.py
          python3 tests/test_tracker.py

      - name: Refresh
        run: |
          args="--apply"
          [ "${{ inputs.dry }}" = "true" ] && args="--dry-run"
          [ "${{ inputs.skip_gmail }}" = "true" ] && args="$args --skip-gmail"
          [ -n "$GOOGLE_REFRESH_TOKEN" ] || args="$args --skip-gmail"
          echo "scripts/refresh.py $args"
          python3 scripts/refresh.py $args
