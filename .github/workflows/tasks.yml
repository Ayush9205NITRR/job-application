name: Tasks

# Code side of the code <-> agent mailbox. setup is additive (creates the Tasks table only if missing).
on:
  workflow_dispatch:
    inputs:
      cmd:
        description: "setup | seed | apply | requeue"
        default: "setup"
      args:
        description: "For seed: company names separated by | (empty = first 5)"
        default: ""

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
      AIRTABLE_BASE_ID: appms9ERcB5Ws3r0w  # pinned: the AIRTABLE_BASE_ID secret still points at the OLD base
      CMD: ${{ inputs.cmd }}
      ARGS: ${{ inputs.args }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests python-dotenv
      - run: python tasks.py "$CMD" "$ARGS"
