name: Daily schedule

# Runs on a timer ONLY when this file is on the default branch. Times are UTC (IST = UTC + 5:30).
#   02:30 every 3rd day  = 08:00 IST   fetch new companies (Apify, about 0.50 USD)
#   hourly 03:00-08:00   = 08:30-13:30 IST   make tasks, apply the agent's answers, build Emails rows, follow-ups
# The agent is started by Ayush at 09:00 IST and 14:00 IST (see RUNBOOK.md). Every run ends with a Your tasks check:
# if you owe something the run fails, and GitHub emails you.
on:
  schedule:
    - cron: "30 2 */3 * *"
    - cron: "0 3-8 * * *"
  workflow_dispatch:
    inputs:
      job:
        description: "fetch | round"
        default: "round"
      dry:
        description: "Dry run: read only, writes nothing, spends nothing"
        type: boolean
        default: true

concurrency: outbound-schedule

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
      AIRTABLE_BASE_ID: appms9ERcB5Ws3r0w  # pinned: the secret may still point at the OLD base
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry && '1' || '' }}
      JOB: ${{ github.event_name == 'schedule' && (github.event.schedule == '30 2 */3 * *' && 'fetch' || 'round') || inputs.job }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests python-dotenv
      - name: Daily work
        run: bash daily.sh "$JOB"
