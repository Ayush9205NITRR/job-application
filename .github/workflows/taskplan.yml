name: Task plan

# Code side of the code <-> agent mailbox. setup is additive (creates the Tasks table only if missing).
on:
  workflow_dispatch:
    inputs:
      cmd:
        description: "round | step | plan | plan-dry | stats | audit | cycle | daily-round-dry | daily-fetch-dry | daily-round | daily-fetch | dashboard"
        default: "stats"
      args:
        description: "Optional: max tasks per type for plan (default 20)"
        default: ""

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
      AIRTABLE_BASE_ID: appms9ERcB5Ws3r0w  # pinned: the AIRTABLE_BASE_ID secret still points at the OLD base
      APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      CMD: ${{ inputs.cmd }}
      ARGS: ${{ inputs.args }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests python-dotenv
      - name: Setup and preflight
        run: |
          python tasks.py setup
          python emails.py setup
          python alerts.py setup
          python runs.py setup
          python preflight.py
      - run: |
          case "$CMD" in
            round) python taskplan.py round --max "${ARGS:-10}" ;;
            step) python taskplan.py step --max "${ARGS:-10}" ;;
            plan) python taskplan.py plan --max "${ARGS:-20}" ;;
            dashboard) python dashboard.py ;;
            daily-round-dry) DRY_RUN=1 bash daily.sh round ;;
            daily-fetch-dry) DRY_RUN=1 bash daily.sh fetch ;;
            daily-round) bash daily.sh round ;;
            daily-fetch) bash daily.sh fetch ;;
            plan-dry) python taskplan.py plan --dry --max "${ARGS:-20}" ;;
            *) python taskplan.py "$CMD" ;;
          esac
      - name: Your tasks (fails the run if you have something to do, so GitHub emails you)
        if: always()
        run: |
          python alerts.py setup
          python alerts.py check
