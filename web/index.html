<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Outbound</title>
<style>
:root{--bg:#f5f6f8;--panel:#fff;--ink:#16191d;--mute:#667085;--line:#e4e7ec;--acc:#3b4cca;--acc-ink:#fff;--ok:#117a4d;--ok-bg:#e7f6ee;--warn:#9a5b00;--warn-bg:#fff3de;--bad:#b42318;--bad-bg:#fdecea;--chip:#eef0f5;--hi:#e9f7ef;--shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08)}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--panel:#171a21;--ink:#e8eaee;--mute:#98a2b3;--line:#2a2f3a;--acc:#7c8cff;--acc-ink:#0f1115;--ok:#4ade80;--ok-bg:#12281d;--warn:#f5b84a;--warn-bg:#2d2412;--bad:#ff8a80;--bad-bg:#2d1715;--chip:#242936;--hi:#12281d;--shadow:none}}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--acc)}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100%}
aside{background:var(--panel);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px}
.brand{font-weight:700;font-size:16px;padding:0 8px 12px}.brand small{display:block;color:var(--mute);font-weight:400;font-size:12px}
.step{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:9px;cursor:pointer;border:0;background:none;text-align:left;width:100%}
.step:hover{background:var(--chip)}.step.on{background:var(--acc);color:var(--acc-ink)}
.step .n{width:22px;height:22px;border-radius:50%;background:var(--chip);color:var(--ink);display:grid;place-items:center;font-size:12px;font-weight:600;flex:none}
.step.on .n{background:rgba(255,255,255,.25);color:inherit}.step.done .n{background:var(--ok-bg);color:var(--ok)}
.step .t{flex:1;font-weight:500}.step .c{font-size:12px;opacity:.8}
.meter{margin-top:auto;padding:10px;border:1px solid var(--line);border-radius:10px;font-size:12px;color:var(--mute)}
.bar{height:6px;background:var(--chip);border-radius:9px;overflow:hidden;margin-top:6px}.bar>i{display:block;height:100%;background:var(--acc);width:0;transition:width .3s}
main{padding:22px 26px 90px;max-width:1180px;width:100%}
h1{font-size:20px;margin:0 0 4px}.sub{color:var(--mute);margin:0 0 16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin:0 0 14px;box-shadow:var(--shadow)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.grow{flex:1}
.btn{padding:8px 14px;border-radius:9px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--acc)}.btn.pri{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:4px 9px;font-size:12px}
input[type=text],input[type=number],select,textarea{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);width:100%}
input:focus,textarea:focus,select:focus{outline:2px solid var(--acc);outline-offset:-1px}
textarea{min-height:110px;resize:vertical}label.f{display:block;font-size:12px;color:var(--mute);margin-bottom:4px}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;background:var(--chip);font-size:12px;margin:1px 3px 1px 0;border:1px solid transparent;cursor:default;white-space:nowrap}
.chip.tog{cursor:pointer;user-select:none}.chip.on{background:var(--acc);color:var(--acc-ink)}
.chip.ok{background:var(--ok-bg);color:var(--ok)}.chip.warn{background:var(--warn-bg);color:var(--warn)}.chip.bad{background:var(--bad-bg);color:var(--bad)}
.note{padding:10px 12px;border-radius:9px;margin:0 0 12px}.note.warn{background:var(--warn-bg);color:var(--warn)}.note.bad{background:var(--bad-bg);color:var(--bad)}.note.ok{background:var(--ok-bg);color:var(--ok)}
.drop{border:2px dashed var(--line);border-radius:12px;padding:34px;text-align:center;color:var(--mute);cursor:pointer;transition:.15s}
.drop:hover,.drop.over{border-color:var(--acc);background:var(--chip);color:var(--ink)}.drop b{color:var(--ink)}
table{width:100%;border-collapse:collapse}th{font-size:12px;color:var(--mute);text-align:left;font-weight:600;padding:6px 8px;position:sticky;top:0;background:var(--panel)}
td{padding:8px;border-top:1px solid var(--line);vertical-align:top}tr.hi td{background:var(--hi)}tr.dim td{opacity:.55}
td small,.mute{color:var(--mute)}.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.sticky{position:fixed;bottom:0;left:230px;right:0;background:var(--panel);border-top:1px solid var(--line);padding:10px 26px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;z-index:5}
.q{padding:12px 14px}.q:focus{outline:2px solid var(--acc)}.q .head{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.q.sel{border-color:var(--acc)}.q pre{white-space:pre-wrap;background:var(--bg);padding:10px;border-radius:8px;margin:8px 0 0;font:13px/1.5 ui-monospace,Menlo,monospace}
.q input.line{margin-top:8px}.q summary{cursor:pointer;color:var(--mute);margin-top:6px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.tab{padding:5px 12px;border-radius:99px;border:1px solid var(--line);background:var(--panel);cursor:pointer}.tab.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
#drawer{position:fixed;right:16px;bottom:16px;width:min(460px,calc(100vw - 32px));background:#0f172a;color:#e2e8f0;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.3);z-index:20;overflow:hidden;display:none}
#drawer header{display:flex;gap:8px;align-items:center;padding:9px 12px;cursor:pointer}#drawer .bar{background:#243049;margin:0 12px 8px}#drawer .bar>i{background:#7c8cff}
#drawer pre{margin:0;padding:0 12px 12px;max-height:220px;overflow:auto;font:12px/1.5 ui-monospace,Menlo,monospace;white-space:pre-wrap}
.spin{width:12px;height:12px;border-radius:50%;border:2px solid #7c8cff;border-right-color:transparent;animation:r .7s linear infinite;display:inline-block}@keyframes r{to{transform:rotate(360deg)}}
#toasts{position:fixed;top:14px;right:14px;display:flex;flex-direction:column;gap:8px;z-index:30}
.toast{background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;box-shadow:var(--shadow);max-width:380px;animation:in .15s}.toast.err{background:var(--bad);color:#fff}@keyframes in{from{opacity:0;transform:translateY(-6px)}}
.skel{height:14px;border-radius:7px;background:linear-gradient(90deg,var(--chip),var(--line),var(--chip));background-size:200% 100%;animation:sh 1.1s infinite;margin:10px 0}@keyframes sh{to{background-position:-200% 0}}
kbd{background:var(--chip);border-radius:5px;padding:1px 6px;font-size:12px;border:1px solid var(--line)}
@media (max-width:820px){.app{grid-template-columns:1fr}aside{position:static;height:auto;flex-direction:row;overflow:auto;padding:8px}.meter,.brand{display:none}.step .c{display:none}main{padding:16px 14px 90px}.sticky{left:0;padding:10px 14px}}
</style>
</head>
<body>
<div class="app">
  <aside id="side"></aside>
  <main><div id="view"></div></main>
</div>
<div id="drawer"></div>
<div id="toasts"></div>
<script>
"use strict";
const TOKEN = "__TOKEN__";
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const STEPS = [[1, "Scrape jobs"], [2, "Apollo CSV"], [3, "ICP and overlap"], [4, "Contacts"], [5, "Review and send"]];
const UNITS = {k: 1e3, m: 1e6, mn: 1e6, million: 1e6, b: 1e9, bn: 1e9, billion: 1e9, l: 1e5, lac: 1e5, lakh: 1e5, cr: 1e7, crore: 1e7};
const SEEDRE = /seed|pre[- ]?seed|angel|bootstrap/i;

const S = {step: 1, companies: null, cerr: "", queue: [], stats: {sent_today: 0, cap: 5, halted: false, counts: {}}, icp: {}, clients: "", keywords: "",
  env: {}, selected: new Set(), manual: {}, qfilter: "review", qsearch: "", csearch: "", hideNon: false, last_scrape: null, warn: "", job: {id: 0, running: false, log: []},
  focus: 0, contactsResult: null, apolloResult: null, verified: "no", drawerOpen: false};
let pollTimer = null, saveTimer = null, icpTimer = null;

// ---------- api ----------
async function api(path, body, opt = {}) {
  const o = {headers: {"X-Token": TOKEN}};
  if (opt.raw !== undefined) { o.method = "POST"; o.body = opt.raw; o.headers["Content-Type"] = "text/csv"; Object.assign(o.headers, opt.headers || {}); }
  else if (body !== undefined) { o.method = "POST"; o.headers["Content-Type"] = "application/json"; o.body = JSON.stringify(body); }
  let r, j;
  try { r = await fetch(path, o); j = await r.json(); } catch (e) { toast("Cannot reach the server. Is `python ui.py` still running?", "err"); throw e; }
  if (!r.ok) { toast(j.error || "Something went wrong", "err"); throw new Error(j.error || r.status); }
  return j;
}
function toast(msg, kind = "") {
  const t = document.createElement("div"); t.className = "toast " + kind; t.textContent = msg; $("#toasts").appendChild(t);
  setTimeout(() => t.remove(), kind === "err" ? 7000 : 3500);
}

// ---------- money / icp ----------
function money(s) {
  const t = String(s ?? "").toLowerCase().replace(/usd|inr|rs\.?|[$₹,]/g, "").trim();
  const m = t.match(/^(\d+(?:\.\d+)?)\s*([a-z]+)?/);
  return m ? parseFloat(m[1]) * (UNITS[m[2] || ""] || 1) : null;
}
function fmt(n) { if (n == null) return "?"; if (n >= 1e9) return (n / 1e9).toFixed(1) + "B"; if (n >= 1e6) return (n / 1e6).toFixed(1).replace(/\.0$/, "") + "M"; if (n >= 1e3) return Math.round(n / 1e3) + "K"; return String(n); }
function icpPass(c) {
  if (c.excluded) return false;   // hard excludes (staffing, events, assistant roles) are never ICP
  const f = S.icp, ok = f.stages ? f.stages.includes(c.stage) : SEEDRE.test(c.stage);
  if (!ok) return false;
  if (c.employees_n != null) { if (f.emp_min != null && c.employees_n < f.emp_min) return false; if (f.emp_max != null && c.employees_n > f.emp_max) return false; }
  if (f.rev_max != null && c.revenue_n != null && c.revenue_n > f.rev_max) return false;
  if (f.funding_max != null && c.funding_n != null && c.funding_n > f.funding_max) return false;
  return true;
}
const matched = () => (S.companies || []).filter(c => c.matched);
const isSel = c => !c.done && (c.id in S.manual ? S.manual[c.id] : icpPass(c));
const selectedList = () => matched().filter(isSel);
function persistSelection() {
  clearTimeout(saveTimer);
  const ids = selectedList().map(c => c.id); S.savedSelected = new Set(ids);   // local copy is the truth, the server catches up
  saveTimer = setTimeout(() => api("/api/select", {selected: ids, shown: matched().map(c => c.id)}).catch(() => {}), 700);
}
function persistIcp() { clearTimeout(icpTimer); icpTimer = setTimeout(() => api("/api/icp", {icp: S.icp}).catch(() => {}), 500); }

// ---------- boot ----------
async function boot() {
  const [st] = await Promise.all([api("/api/state")]);
  applyState(st);
  const hash = parseInt((location.hash.match(/#\/(\d)/) || [])[1]);
  S.step = hash || (S.queue.length ? 5 : 1);
  render();
  loadCompanies().then(() => { if (!hash && S.step === 1 && matched().length) S.step = 3; render(); });
  pollJob(true);
}
function applyState(st) {
  Object.assign(S, {queue: st.queue, stats: st.stats, icp: st.icp, clients: st.clients, keywords: st.keywords, env: st.env, last_scrape: st.last_scrape, warn: st.warn});
  S.savedSelected = new Set(st.selected);
}
async function loadCompanies(refresh) {
  const r = await api("/api/companies" + (refresh ? "?refresh=1" : ""));
  S.companies = r.companies; S.cerr = r.error;
  if (S.savedSelected && S.savedSelected.size && !Object.keys(S.manual).length) {
    for (const c of matched()) S.manual[c.id] = S.savedSelected.has(c.id);
  }
}
async function reloadState() { applyState(await api("/api/state")); }

// ---------- job polling ----------
async function pollJob(first) {
  clearTimeout(pollTimer);
  let j; try { j = await api("/api/job"); } catch { return; }
  const was = S.job.running; S.job = j; drawer();
  if (j.running) pollTimer = setTimeout(pollJob, 900);
  else if (was) onJobDone(j);
}
async function onJobDone(j) {
  S.jobDoneAt = Date.now(); setTimeout(drawer, 6200);
  await reloadState();
  if (j.name === "scrape jobs") await loadCompanies(true);        // new companies live in Airtable
  else if (j.name === "find overlap") await loadCompanies(false); // results are local, no Airtable round trip
  toast(`${j.name}: done`); render();
}
function startedJob(r, label) { if (r.started === false) toast("Another job is still running", "err"); else { toast(label + " started"); S.jobDoneAt = 0; S.job = {...S.job, running: true, name: label, log: [], done: 0, total: 0}; S.drawerOpen = true; drawer(); pollJob(); } }
function drawer() {
  const d = $("#drawer"), j = S.job;
  if (!j.id || (!j.running && !S.drawerOpen && S.jobDoneAt && Date.now() - S.jobDoneAt > 6000)) { d.style.display = "none"; return; }
  d.style.display = "block";
  const pct = j.total ? Math.round(100 * j.done / j.total) : (j.running ? 8 : 100);
  d.innerHTML = `<header data-act="drawer">${j.running ? '<span class="spin"></span>' : "✓"}<b class="grow">${esc(j.name)}</b><span>${j.total ? j.done + "/" + j.total : (j.running ? "running" : "finished")}</span></header>
    <div class="bar"><i style="width:${pct}%"></i></div>${S.drawerOpen || j.running ? `<pre>${esc((j.log || []).slice(-80).join("\n"))}</pre>` : ""}`;
  const pre = $("#drawer pre"); if (pre) pre.scrollTop = pre.scrollHeight;
}

// ---------- shell ----------
function counts() {
  const m = matched(), sel = selectedList();
  return {1: S.companies ? S.companies.length : "", 2: m.length || "", 3: sel.length || "", 4: S.queue.length || "", 5: (S.stats.counts.approved || 0) + "/" + (S.stats.counts.review || 0)};
}
function side() {
  const c = counts();
  $("#side").innerHTML = `<div class="brand">Founder's Office outbound<small>nothing sends without your click</small></div>` +
    STEPS.map(([n, t]) => `<button class="step ${S.step === n ? "on" : ""} ${n < S.step ? "done" : ""}" data-act="go" data-n="${n}"><span class="n">${n}</span><span class="t">${t}</span><span class="c">${esc(c[n])}</span></button>`).join("") +
    `<div class="meter">Sent today <b>${S.stats.sent_today}/${S.stats.cap}</b><div class="bar"><i style="width:${Math.min(100, 100 * S.stats.sent_today / Math.max(1, S.stats.cap))}%"></i></div>
     ${S.stats.halted ? '<div class="chip bad" style="margin-top:6px">sending halted: bounces</div>' : ""}</div>`;
}
function head(t, sub) { return `<h1>${t}</h1><p class="sub">${sub}</p>${S.warn ? `<div class="note warn">${esc(S.warn)}</div>` : ""}`; }
function render() {
  side();
  const v = $("#view"), keep = document.activeElement && document.activeElement.id;
  v.innerHTML = [null, view1, view2, view3, view4, view5][S.step]();
  if (keep) { const e = document.getElementById(keep); if (e) { e.focus(); try { e.setSelectionRange(e.value.length, e.value.length); } catch {} } }
}
function go(n) { S.step = n; location.hash = "#/" + n; render(); window.scrollTo(0, 0); }

// ---------- 1 scrape ----------
function view1() {
  const e = S.env, ls = S.last_scrape;
  return head("1. Scrape jobs", "Apify finds Founder's Office jobs on LinkedIn. Companies and their jobs are saved to Airtable, duplicates are merged.") +
    (!e.apify || !e.airtable ? `<div class="note warn">${!e.apify ? "APIFY_TOKEN is not set. " : ""}${!e.airtable ? "AIRTABLE_TOKEN / AIRTABLE_BASE_ID are not set. " : ""}Add them as Codespaces secrets (or in .env) and restart.</div>` : "") +
    `<div class="card"><div class="filters"><div style="grid-column:span 2"><label class="f">Keywords (one per line)</label><textarea id="kw">${esc(S.keywords)}</textarea></div>
      <div><label class="f">Location</label><input type="text" id="loc" value="India"></div><div><label class="f">Max jobs per keyword</label><input type="number" id="lim" value="100" min="10" max="1000"></div></div>
      <div class="row" style="margin-top:12px"><button class="btn pri" data-act="scrape" ${S.job.running ? "disabled" : ""}>Run scrape</button>
      <span class="mute">Takes 2 to 4 minutes. Progress shows bottom right. Costs about $0.30 per 1,000 jobs.</span></div></div>
    <div class="card"><b>Airtable now</b><div class="row" style="margin-top:6px"><span class="chip">${S.companies ? S.companies.length : "..."} companies</span>
      ${ls ? `<span class="chip ok">last scrape: ${ls.jobs} jobs, ${ls.companies} companies</span>` : ""}
      <button class="btn sm" data-act="refresh">Refresh from Airtable</button><span class="grow"></span><button class="btn pri" data-act="go" data-n="2">Next: Apollo CSV</button></div>
      ${S.cerr ? `<div class="note bad" style="margin-top:10px">${esc(S.cerr)}</div>` : ""}</div>
    <div class="card"><b>LinkedIn posts</b> <span class="chip warn">not connected</span><p class="mute" style="margin:6px 0 0">Posts need a second Apify actor. Tell me which actor you want to use and it plugs in here next to jobs.</p></div>`;
}

// ---------- 2 apollo ----------
function health() {
  const cs = S.companies || [], n = cs.length;
  if (!n) return "";
  const c = f => cs.filter(f).length, m = c(x => x.matched);
  const items = [["companies", n], ["LinkedIn link", c(x => x.li)], ["website", c(x => x.website)], ["with a job", c(x => x.jobs.length)], ["Apollo data", m], ["ICP match", c(x => x.matched && icpPass(x))]];
  const hint = !m ? "No Apollo data yet. The ICP filter needs funding stage and employees from the Apollo CSV." : (c(x => x.website) < n / 2 ? "Few companies have a website. The overlap check needs one; the Apollo Website column fills it when you save." : "");
  return `<div class="card"><b>Your data right now</b><div class="row" style="margin-top:6px">${items.map(([k, v]) => `<span class="chip ${v ? "" : "bad"}">${k} <b>${v}</b></span>`).join("")}</div>${hint ? `<p class="mute" style="margin:8px 0 0">${hint}</p>` : ""}</div>`;
}
function previewCard(p) {
  const miss = Object.entries(p.fields_found).filter(([, v]) => !v).map(([k]) => k);
  return `<div class="card"><div class="row"><b>Preview, nothing is saved yet</b><span class="grow"></span><button class="btn" data-act="apollo-discard">Discard</button><button class="btn pri" data-act="apollo-commit" ${p.matched ? "" : "disabled"}>Looks right, save to Airtable</button></div>
    ${p.matched ? "" : '<div class="note bad" style="margin-top:10px">Nothing matched. The file needs <b>Company Linkedin Url</b> (best) or <b>Website</b> or the exact company name.</div>'}
    ${miss.length ? `<div class="note warn" style="margin-top:10px">Column not found in the file: <b>${miss.map(esc).join(", ")}</b>. Check the header names (Funding, Funding Stage, Revenue, Employees).</div>` : ""}
    <div class="row" style="margin:10px 0"><span class="chip">${p.csv_rows} rows in file</span><span class="chip">${p.apollo} companies</span><span class="chip ok">${p.matched} matched</span>
      ${Object.entries(p.methods).map(([k, v]) => `<span class="chip">via ${esc(k)} ${v}</span>`).join("")}<span class="chip ${p.unmatched ? "warn" : ""}">${p.unmatched} not in your ${p.airtable_companies} scraped</span><span class="chip ok">${p.icp} fit the ICP</span></div>
    <div class="row" style="margin-bottom:8px">${Object.entries(p.fields_found).map(([k, v]) => `<span class="chip ${v ? "ok" : "bad"}">${esc(k)}: ${v}/${p.apollo}</span>`).join("")}</div>
    <div style="max-height:320px;overflow:auto"><table><tr><th>Apollo company</th><th>Matched to</th><th>How</th><th>Stage</th><th>Funding</th><th>Revenue</th><th>Emp.</th><th>ICP</th></tr>
    ${p.rows.slice(0, 40).map(r => `<tr class="${r.icp ? "hi" : ""}"><td>${esc(r.apollo)}</td><td>${esc(r.company)}</td><td>${esc(r.method)}</td><td>${esc(r.stage)}</td><td class="num">${esc(r.funding)}</td><td class="num">${esc(r.revenue)}</td><td class="num">${esc(r.employees)}</td><td>${r.icp ? "yes" : "no"} <small>${esc(r.why)}</small></td></tr>`).join("")}</table></div>
    ${p.unmatched_sample.length ? `<p class="mute" style="margin:10px 0 0">Not found in your scrape (first ${p.unmatched_sample.length}): ${p.unmatched_sample.map(esc).join(", ")}</p>` : ""}</div>`;
}
function view2() {
  const r = S.apolloResult, m = matched();
  return head("2. Apollo account CSV", "Export your Apollo companies with: <b>Company Linkedin Url</b> (or Website / name), <b>Funding</b>, <b>Funding Stage</b>, <b>Revenue</b>, <b>Employees</b>. You see a preview first, nothing is written until you confirm.") + health() +
    `<div class="card"><div class="drop" id="drop2" data-act="choose" data-target="file2"><b>Drop the Apollo CSV here</b> or click to choose<input id="file2" type="file" accept=".csv" hidden></div>
      ${r ? `<div class="note ok" style="margin-top:12px">Saved: ${r.apollo} Apollo companies, <b>${r.matched} matched</b> ${Object.entries(r.methods || {}).map(([k, v]) => `<span class="chip">${esc(k)} ${v}</span>`).join("")}</div>` : ""}</div>` +
    (S.apolloPreview ? previewCard(S.apolloPreview) : "") +
    (m.length && !S.apolloPreview ? `<div class="card"><div class="row"><b>${m.length} companies have Apollo data</b><span class="grow"></span><button class="btn pri" data-act="go" data-n="3">Next: ICP and overlap</button></div></div>` : "");
}

// ---------- 3 icp + overlap ----------
function stageChips() {
  const counts = {}; for (const c of matched()) if (c.stage) counts[c.stage] = (counts[c.stage] || 0) + 1;
  const on = S.icp.stages ? new Set(S.icp.stages) : new Set(Object.keys(counts).filter(s => SEEDRE.test(s)));
  return Object.entries(counts).sort((a, b) => b[1] - a[1]).map(([s, n]) => `<span class="chip tog ${on.has(s) ? "on" : ""}" data-act="stage" data-s="${esc(s)}">${esc(s)} ${n}</span>`).join("") || '<span class="mute">no stages in the data</span>';
}
function view3() {
  if (S.companies === null) return head("3. ICP and overlap", "Loading companies from Airtable...") + '<div class="card"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>';
  if (S.cerr) return head("3. ICP and overlap", "") + `<div class="note bad">${esc(S.cerr)}</div>`;
  const all = matched();
  if (!all.length) return head("3. ICP and overlap", "") + `<div class="card">No company has Apollo data yet. <button class="btn pri" data-act="go" data-n="2">Upload the Apollo CSV</button></div>`;
  const sel = selectedList(), q = S.csearch.toLowerCase();
  const pitch = sel.filter(c => c.inter && c.inter.pick && c.inter.pick.length).length;
  let rows = all.filter(c => !q || c.name.toLowerCase().includes(q));
  if (S.hideNon) rows = rows.filter(c => isSel(c));
  rows.sort((a, b) => (isSel(b) - isSel(a)) || a.name.localeCompare(b.name));
  const f = S.icp, v = k => (f[k] == null ? "" : k.endsWith("max") && k !== "emp_max" ? fmt(f[k]) : f[k]);
  return head("3. ICP and overlap", "Tune the ICP, the matching companies are ticked live. Then check which of your clients each company also works with.") +
    `<div class="card"><div class="row"><b>ICP filter</b><span class="chip ok" id="icpcount">${all.filter(icpPass).length} of ${all.length} match</span><span class="grow"></span><button class="btn sm" data-act="reseticp">Reset</button></div>
      <div style="margin:8px 0">${stageChips()}</div>
      <div class="filters"><div><label class="f">Employees min</label><input type="number" data-icp="emp_min" value="${v("emp_min")}"></div><div><label class="f">Employees max</label><input type="number" data-icp="emp_max" value="${v("emp_max")}"></div>
      <div><label class="f">Revenue max (e.g. 5M)</label><input type="text" data-icp="rev_max" value="${v("rev_max")}" placeholder="no limit"></div><div><label class="f">Funding max (e.g. 10M)</label><input type="text" data-icp="funding_max" value="${v("funding_max")}" placeholder="no limit"></div></div>
      <p class="mute" style="margin:8px 0 0">Unknown values pass the filter. Changing the filter re-ticks the list; your manual ticks are kept until then.</p></div>
    <div class="card"><details ${S.clients.trim() ? "" : "open"}><summary><b>My clients</b> <span class="mute">${(S.clients.split("\n").filter(l => l.trim() && !l.trim().startsWith("#")).length)} listed. One per line, <code>Name | alias | alias</code>, put # in front to leave one out</span></summary>
      <textarea id="clients" style="margin-top:8px">${esc(S.clients)}</textarea><p class="mute" style="margin:6px 0 0">The names are written into emails to companies that also work with them. Only list clients you are free to mention.</p></details></div>
    <div class="card"><div class="row"><input type="text" id="csearch" placeholder="Search companies" value="${esc(S.csearch)}" style="max-width:240px"><label class="row mute" style="gap:6px"><input type="checkbox" id="hidenon" ${S.hideNon ? "checked" : ""}> only ticked</label><span class="grow"></span>
      <span class="chip">${sel.length} selected</span><span class="chip ok">${pitch} pitch</span><span class="chip">${sel.length - pitch} generic</span></div>
      <div class="row" style="margin:10px 0"><button class="btn pri" data-act="intersect" ${S.job.running || !sel.length ? "disabled" : ""}>Check overlap with my clients (${sel.length})</button>
        <span class="mute">Block apply time:</span><input type="number" id="per" value="5" min="1" max="20" style="width:64px" title="companies per block"><input type="text" id="at" value="11:00" style="width:78px" title="IST"><button class="btn" data-act="ics" ${sel.length ? "" : "disabled"}>Download calendar (.ics)</button>
        <button class="btn" data-act="applied" ${sel.length ? "" : "disabled"}>Mark applied</button><span class="grow"></span><button class="btn pri" data-act="go" data-n="4">Next: Contacts</button></div>
      <div style="max-height:62vh;overflow:auto"><table><tr><th></th><th>Company</th><th>Stage</th><th>Funding</th><th>Revenue</th><th>Emp.</th><th>Jobs</th><th>Overlap with my clients</th><th>Email</th></tr>
      ${rows.map(c => rowHtml(c)).join("") || '<tr><td colspan="9" class="mute">No company matches.</td></tr>'}</table></div></div>`;
}
function rowHtml(c) {
  const on = isSel(c), p = icpPass(c), i = c.inter;
  let ov = '<span class="mute">not checked</span>';
  if (i) ov = i.names.length ? i.names.map(n => `<span class="chip tog ${i.pick.includes(n) ? "on" : ""}" data-act="chip" data-id="${esc(c.id)}" data-n="${esc(n)}" title="click to include or leave out">${esc(n)}</span>`).join("") : `<span class="mute">${esc(i.note || "none")}</span>`;
  const kind = !on ? "" : (i && i.pick.length ? '<span class="chip ok">Pitch</span>' : '<span class="chip">Generic</span>');
  const job = c.jobs[0] ? `<a href="${esc(c.jobs[0].url)}" target="_blank" rel="noopener">${esc(c.jobs[0].title)}</a>${c.jobs.length > 1 ? ` <small>+${c.jobs.length - 1}</small>` : ""}` : '<small>no job</small>';
  return `<tr class="${p ? "hi" : ""} ${on ? "" : "dim"}"><td><input type="checkbox" data-sel="${esc(c.id)}" ${on ? "checked" : ""} ${c.done ? "disabled" : ""}></td>
    <td><b>${c.li ? `<a href="${esc(c.li)}" target="_blank" rel="noopener">${esc(c.name)}</a>` : esc(c.name)}</b>${c.done || c.excluded ? ` <span class="chip ${c.excluded ? "bad" : ""}">${esc(c.status)}</span>` : ""}</td>
    <td>${esc(c.stage) || "?"}</td><td class="num">${fmt(c.funding_n)}</td><td class="num">${fmt(c.revenue_n)}</td><td class="num">${c.employees_n ?? "?"}</td><td>${job}</td><td>${ov}</td><td>${kind}</td></tr>`;
}

// ---------- 4 contacts ----------
function view4() {
  const sel = selectedList(), r = S.contactsResult, have = new Set(S.queue.map(x => x.company));
  const need = sel.filter(c => !have.has(c.name));
  return head("4. Contacts", "Upload the people you want to email: <b>Company Linkedin</b>, <b>POC First Name</b>, <b>POC Email</b>, <b>POC Contact Detail</b>. Only people at your <b>selected</b> companies are added, as drafts.") +
    `<div class="card"><div class="row"><b>These emails are</b><div class="tabs" style="margin:0"><span class="tab ${S.verified === "no" ? "on" : ""}" data-act="ver" data-v="no">Not verified (skip them)</span><span class="tab ${S.verified === "yes" ? "on" : ""}" data-act="ver" data-v="yes">Verified</span></div>
      <span class="mute">Unverified emails hurt your Gmail reputation. A file with an Email Status column is judged per row.</span></div>
      <div class="drop" id="drop4" style="margin-top:12px" data-act="choose" data-target="file4"><b>Drop the contacts CSV here</b> or click to choose<input id="file4" type="file" accept=".csv" hidden></div>
      ${r ? `<div class="note ok" style="margin-top:12px">Added <b>${r.added}</b> drafts: ${r.pitched} pitch, ${r.generic} generic. Skipped: ${Object.entries(r.skipped).filter(([, v]) => v).map(([k, v]) => `${esc(k)} ${v}`).join(", ") || "none"}.</div>` : ""}
      ${r && r.added ? `<button class="btn pri" data-act="go" data-n="5">Review the drafts</button>` : ""}</div>
    <div class="card"><b>${need.length} selected companies still have no contact</b> <span class="mute">(find the person on LinkedIn or Apollo, add them to the CSV)</span>
      <div style="margin-top:8px">${need.map(c => `<a class="chip" href="${esc(c.li)}" target="_blank" rel="noopener">${esc(c.name)}</a>`).join("") || '<span class="mute">none</span>'}</div>
      ${need.length ? `<button class="btn sm" style="margin-top:8px" data-act="copyneed">Copy company LinkedIn links</button>` : ""}</div>`;
}

// ---------- 5 review ----------
const qvis = () => S.queue.filter(r => (S.qfilter === "all" || r.status === S.qfilter) && (!S.qsearch || (r.first + r.company + r.email).toLowerCase().includes(S.qsearch.toLowerCase())));
function view5() {
  const st = S.stats, rows = qvis(), c = st.counts, rev = S.queue.filter(r => r.status === "review");
  const nP = rev.filter(r => r.pitch.length).length, nG = rev.length - nP, left = Math.max(0, st.cap - st.sent_today);
  return head("5. Review and send", "Check each email, fix the opening line if you like, approve, then send. Keys: <kbd>j</kbd><kbd>k</kbd> move, <kbd>a</kbd> approve, <kbd>s</kbd> skip, <kbd>e</kbd> edit line, <kbd>x</kbd> show email.") +
    (!S.env.gmail ? '<div class="note warn">GMAIL_USER / GMAIL_APP_PASSWORD are not set. You can review, but sending needs them.</div>' : "") +
    `<div class="tabs">${["review", "approved", "sent", "closed", "all"].map(t => `<span class="tab ${S.qfilter === t ? "on" : ""}" data-act="qf" data-t="${t}">${t} ${t === "all" ? S.queue.length : (c[t] || 0)}</span>`).join("")}<input type="text" id="qsearch" placeholder="Search" value="${esc(S.qsearch)}" style="max-width:200px;margin-left:auto"></div>
    ${S.qfilter === "review" && rev.length ? `<div class="row" style="margin-bottom:12px"><button class="btn" data-act="appr" data-w="pitch" ${nP ? "" : "disabled"}>Approve all pitch (${nP})</button><button class="btn" data-act="appr" data-w="generic" ${nG ? "" : "disabled"}>Approve all generic (${nG})</button><button class="btn pri" data-act="appr" data-w="all">Approve all (${rev.length})</button></div>` : ""}
    ${rows.map((r, i) => qcard(r, i)).join("") || '<div class="card mute">Nothing here.</div>'}
    <div class="sticky"><b>${c.approved || 0} approved</b><span class="mute">${left} sends left today (cap ${st.cap})</span><span class="grow"></span>
      <button class="btn" data-act="send" data-w="dry" ${S.job.running ? "disabled" : ""}>Dry run</button><button class="btn" data-act="send" data-w="cycle" ${S.job.running ? "disabled" : ""}>Full cycle</button>
      <button class="btn pri" data-act="send" data-w="send" ${S.job.running || !c.approved || st.halted ? "disabled" : ""}>Send approved + follow-ups</button></div>`;
}
function qcard(r, i) {
  const ed = r.status === "review" || r.status === "approved";
  return `<article class="card q ${i === S.focus ? "sel" : ""}" tabindex="0" data-n="${r.n}" data-i="${i}">
    <div class="head">${ed ? `<input type="checkbox" data-appr="${r.n}" ${r.status === "approved" ? "checked" : ""} title="approve (a)">` : ""}<b>${esc(r.first)}</b><span>${esc(r.company)}</span><small class="mute">${esc(r.email)}</small>
      ${r.pitch.length ? `<span class="chip ok" title="${esc(r.note)}">Pitch: ${esc(r.pitch.join(", "))}</span>` : '<span class="chip">Generic</span>'}<span class="grow"></span><span class="chip ${r.status === "approved" ? "ok" : ""}">${esc(r.state)}</span>
      ${ed ? `<button class="btn sm" data-act="skip" data-n="${r.n}">Skip</button>` : ""}${r.wa ? `<a class="btn sm" href="${esc(r.wa)}" target="_blank" rel="noopener">WhatsApp</a>` : ""}</div>
    ${ed ? `<input class="line" type="text" data-line="${r.n}" value="${esc(r.line)}" aria-label="opening line">` : `<div class="mute" style="margin-top:6px">${esc(r.line)}</div>`}
    <details><summary>Email</summary><b>${esc(r.subject)}</b><pre>${esc(r.body)}</pre></details></article>`;
}
function patchRow(n, patch) { const r = S.queue.find(x => x.n === n); if (r) Object.assign(r, patch); }
async function approveToggle(n, on) {
  patchRow(n, {status: on ? "approved" : "review", state: on ? "approved, waiting for next send" : "needs review"}); side();
  try { const r = await api(on ? "/api/queue/approve" : "/api/queue/unapprove", {rows: [n]}); S.queue = r.queue; if (r.errors.length) toast(r.errors.join("; "), "err"); }
  catch { await reloadState(); }
  await reloadStats(); render();
}
async function reloadStats() { const st = await api("/api/state"); S.stats = st.stats; S.queue = st.queue; }

// ---------- events ----------
document.addEventListener("click", async e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const a = el.dataset.act;
  if (a === "go") return go(+el.dataset.n);
  if (a === "drawer") { S.drawerOpen = !S.drawerOpen; return drawer(); }
  if (a === "chip") return;
  if (a === "choose") { if (e.target.closest("input")) return; return $("#" + el.dataset.target).click(); }
  if (a === "refresh") { await loadCompanies(true); toast("Refreshed from Airtable"); return render(); }
  if (a === "scrape") { const kws = $("#kw").value; S.keywords = kws; return startedJob(await api("/api/scrape", {keywords: kws, location: $("#loc").value, limit: +$("#lim").value || null}), "scrape jobs"); }
  if (a === "stage") {
    const all = [...new Set(matched().map(c => c.stage).filter(Boolean))], cur = S.icp.stages || all.filter(s => SEEDRE.test(s)), s = el.dataset.s;
    S.icp.stages = cur.includes(s) ? cur.filter(x => x !== s) : [...cur, s]; S.manual = {}; persistIcp(); persistSelection(); return render();
  }
  if (a === "reseticp") { S.icp = {stages: null, emp_min: 2, emp_max: 50, rev_max: null, funding_max: null}; S.manual = {}; persistIcp(); persistSelection(); return render(); }
  if (a === "intersect") {
    await api("/api/clients", {text: $("#clients") ? $("#clients").value : S.clients });
    return startedJob(await api("/api/intersect", {ids: selectedList().map(c => c.id)}), "find overlap");
  }
  if (a === "ics") {
    const [h, m] = ($("#at").value || "11:00").split(":");
    const r = await api("/api/ics", {ids: selectedList().map(c => c.id), per: +$("#per").value || 5, hour: +h || 11, minute: +m || 0});
    const url = URL.createObjectURL(new Blob([r.ics], {type: "text/calendar"})), x = document.createElement("a"); x.href = url; x.download = "apply-blocks.ics"; x.click(); URL.revokeObjectURL(url);
    return toast(`${r.blocks} calendar blocks downloaded. Open the file once to add them.`);
  }
  if (a === "applied") { if (!confirm("Mark the ticked companies and their jobs as applied?")) return; const r = await api("/api/applied", {ids: selectedList().map(c => c.id)}); await loadCompanies(true); toast(`${r.n} marked applied`); return render(); }
  if (a === "apollo-discard") { await api("/api/apollo/discard", {}); S.apolloPreview = null; return render(); }
  if (a === "apollo-commit") {
    el.disabled = true; el.textContent = "Saving to Airtable...";
    try { S.apolloResult = await api("/api/apollo/commit", {}); S.apolloPreview = null; S.manual = {}; await loadCompanies(true); toast("Saved to Airtable"); go(3); } catch { render(); }
    return;
  }
  if (a === "ver") { S.verified = el.dataset.v; return render(); }
  if (a === "copyneed") { const need = selectedList().filter(c => !new Set(S.queue.map(x => x.company)).has(c.name)); await navigator.clipboard.writeText(need.map(c => c.li).join("\n")); return toast("Copied"); }
  if (a === "qf") { S.qfilter = el.dataset.t; S.focus = 0; return render(); }
  if (a === "appr") {
    const r = await api("/api/queue/approve", {rows: el.dataset.w}); S.queue = r.queue; await reloadStats(); toast(`${r.changed} approved`); return render();
  }
  if (a === "skip") { const r = await api("/api/queue/skip", {rows: [+el.dataset.n]}); S.queue = r.queue; await reloadStats(); return render(); }
  if (a === "send") {
    const w = el.dataset.w, n = S.stats.counts.approved || 0, left = Math.max(0, S.stats.cap - S.stats.sent_today);
    if (w !== "dry" && !confirm(w === "send" ? `Send up to ${Math.min(n, left)} approved emails now (and any due follow-ups)?\nEach one waits 2 to 5 minutes after the last.` : "Run the full cycle: read inbox, send approved, follow-ups, digest email?")) return;
    return startedJob(await api("/api/send", {what: w}), w === "dry" ? "dry" : w);
  }
});
document.addEventListener("change", async e => {
  const t = e.target;
  if (t.dataset.sel !== undefined) { S.manual[t.dataset.sel] = t.checked; persistSelection(); return render(); }
  if (t.dataset.icp) {
    const k = t.dataset.icp, raw = t.value.trim(); S.icp[k] = raw === "" ? null : (k.includes("max") && k !== "emp_max" ? money(raw) : +raw);
    S.manual = {}; persistIcp(); persistSelection(); return render();
  }
  if (t.id === "hidenon") { S.hideNon = t.checked; return render(); }
  if (t.dataset.appr) return approveToggle(+t.dataset.appr, t.checked);
  if (t.dataset.line) {
    const n = +t.dataset.line, text = t.value; patchRow(n, {line: text});
    try { const r = await api("/api/queue/line", {row: n, text}); S.queue = r.queue; if (r.errors.length) { toast(r.errors.join("; "), "err"); await reloadStats(); } } catch { await reloadStats(); }
    return render();
  }
  if (t.id === "clients") { S.clients = t.value; api("/api/clients", {text: t.value}); return; }
  if (t.type === "file") { const f = t.files[0]; if (!f) return; return t.id === "file2" ? uploadApollo(f) : uploadContacts(f); }
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "csearch") { S.csearch = t.value; render(); }
  if (t.id === "qsearch") { S.qsearch = t.value; S.focus = 0; render(); }
});
document.addEventListener("click", async e => {
  const c = e.target.closest(".chip.tog[data-id]"); if (!c) return;
  const co = S.companies.find(x => x.id === c.dataset.id), n = c.dataset.n, p = co.inter.pick;
  co.inter.pick = p.includes(n) ? p.filter(x => x !== n) : [...p, n]; render(); api("/api/pick", {id: co.id, names: co.inter.pick});
});
for (const ev of ["dragover", "dragleave", "drop"]) document.addEventListener(ev, e => {
  const d = e.target.closest(".drop"); if (!d) return; e.preventDefault();
  d.classList.toggle("over", ev === "dragover");
  if (ev === "drop" && e.dataTransfer.files[0]) d.id === "drop2" ? uploadApollo(e.dataTransfer.files[0]) : uploadContacts(e.dataTransfer.files[0]);
});
async function uploadApollo(f) {
  const d = $("#drop2"); if (d) d.innerHTML = '<span class="spin" style="border-color:var(--acc);border-right-color:transparent"></span> Reading ' + esc(f.name) + "...";
  try { S.apolloPreview = await api("/api/apollo", undefined, {raw: f}); S.apolloResult = null; } catch {}
  render();
}
async function uploadContacts(f) {
  const d = $("#drop4"); if (d) d.innerHTML = '<span class="spin" style="border-color:var(--acc);border-right-color:transparent"></span> Adding ' + esc(f.name) + "...";
  try {
    clearTimeout(saveTimer);   // the server must know exactly what is ticked before it accepts contacts
    await api("/api/select", {selected: selectedList().map(c => c.id), shown: matched().map(c => c.id)});
    S.contactsResult = await api("/api/contacts", undefined, {raw: f, headers: {"X-Verified": S.verified}}); await reloadStats();
  } catch {}
  render();
}
document.addEventListener("keydown", e => {
  if (S.step !== 5 || /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) && e.key !== "Escape") return;
  const cards = $$(".q"), k = e.key;
  if (!cards.length) return;
  const focusCard = i => { S.focus = Math.max(0, Math.min(cards.length - 1, i)); $$(".q").forEach((c, j) => c.classList.toggle("sel", j === S.focus)); $$(".q")[S.focus].scrollIntoView({block: "center", behavior: "smooth"}); };
  const cur = cards[S.focus], n = cur && +cur.dataset.n, row = S.queue.find(x => x.n === n);
  if (k === "j") focusCard(S.focus + 1); else if (k === "k") focusCard(S.focus - 1);
  else if (k === "a" && row && (row.status === "review" || row.status === "approved")) approveToggle(n, row.status !== "approved");
  else if (k === "s" && row && row.status === "review") api("/api/queue/skip", {rows: [n]}).then(r => { S.queue = r.queue; return reloadStats(); }).then(render);
  else if (k === "e") { const i = $("input.line", cur); if (i) { e.preventDefault(); i.focus(); } }
  else if (k === "x") { const d = $("details", cur); if (d) d.open = !d.open; }
});
window.addEventListener("hashchange", () => { const n = parseInt((location.hash.match(/#\/(\d)/) || [])[1]); if (n && n !== S.step) { S.step = n; render(); } });
boot();
</script>
</body>
</html>
